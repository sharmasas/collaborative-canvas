<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Collaborative Canvas</title>

    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="libraries/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js"></script>
    <script src="dropdown.js"></script>
  
    <style>
      
      body {
        display: block;
        text-align: center;
        position: absolute;
      }
      h2 {
        padding-bottom: 30px;
      }
      button {
        margin: 0;
      }
      p a {
        font-size: 14px;
        text-decoration: none;
        opacity: 0.6;
        transition: 0.3;
      }
      
      #myVideo {
        right: 0;
        bottom: 0;
        height: 0;
        width: 100%;
        overflow: hidden;
        object-fit: cover;
        z-index: -99;
        position: relative;
        opacity: 0.7;
        transition: height 0.66s ease-out;
      }
      
      #myVideo.loaded {
        height: 60vh;
      }

    </style>
  </head>
  
  <body>
    <video autoplay muted loop id="myVideo" width="800" height="600" name="Video Name" src="https://cdn.glitch.com/83ca1fc1-fa05-43cd-9f17-18522a86672b%2Frainbow.mov?v=1587431266673"></video>
    <h2>
      <a href="index.html">
        collaborative canvas
      </a>
    </h2>
    <button>
      <a href="rainbow-draw.html">Launch</a>
    </button> 
    <p>
      <a href="">About</a>
    </p>
  </body>
</html>
