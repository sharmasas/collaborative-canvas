<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Canvas</title>
    <link rel="stylesheet" type="text/css" href="style.css" />  
    <style>
      
      body {
        display: block;
        text-align: center;
      }
      
      .content {
        position: fixed;
        bottom: 150px;
        width: 100%;
      }
      
      h2 {
        padding-bottom: 30px;
      }
      
      h2 a {
        opacity: 0.8;
      }
      
      p a {
        font-size: 14px;
        text-decoration: none;
        opacity: 0.8;
        transition: 0.3; 
      }
      
      body {
        overflow-x: hidden;
      }

      #myVideo {
        right: 0;
        bottom: 0;
        width: 100%;
        min-height: 60vh;
        overflow: hidden;
        object-fit: cover;
        z-index: -99;
        position: relative;
        opacity: 0.4;
      }
    </style>
  </head>
  
  <body>
    
    <video autoplay muted loop playsinline id="myVideo" width="800" height="600" name="Video Name" src="rainbow.mp4"></video>
    
    <div class="content">
      <h2>
        <a href="index.html">
          collaborative canvas
        </a>
      </h2>
      <p>
        <button id="index-btn" onclick="location.href='calligraphy.html';">Launch</button>
      </p>
    </div>
    
  </body>
</html>
